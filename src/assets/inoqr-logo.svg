<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="INOQR logo">
  <!-- Official INOQR mark: rounded hexagon + QR glyph. No micro-type
       inside the mark — the wordmark is set in HTML beside it. -->
  <path d="M88,48 L68,82.64 L28,82.64 L8,48 L28,13.36 L68,13.36 Z"
        fill="#1D5BD7" stroke="#1D5BD7" stroke-width="12"
        stroke-linejoin="round"/>
  <path d="M81.6,48 L64.8,77.1 L31.2,77.1 L14.4,48 L31.2,18.9 L64.8,18.9 Z"
        fill="none" stroke="#FFFFFF" stroke-width="2"
        stroke-linejoin="round" opacity="0.9"/>
  <!-- QR glyph -->
  <g fill="#FFFFFF">
    <rect x="30" y="28" width="17" height="17" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="36" y="34" width="6" height="6"/>
    <rect x="56" y="28" width="6" height="6"/>
    <rect x="65" y="28" width="6" height="6"/>
    <rect x="56" y="37" width="6" height="6"/>
    <rect x="65" y="46" width="6" height="6"/>
    <rect x="30" y="51" width="17" height="17" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="36" y="57" width="6" height="6"/>
    <rect x="56" y="51" width="17" height="17" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <polygon points="75,72 62,56 66.5,54 60,46.5 64.5,44.5 71,52 74,49.5"/>
  </g>
</svg>
